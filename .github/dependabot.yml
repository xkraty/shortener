version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    rails:
      patterns:
      - rails
      - railties
      - active*
      - action*
    dev-and-test:
      dependency-type: development
    production:
      dependency-type: production
      exclude-patterns:
      - rails
      - railties
      - active*
      - action*
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    actions:
      patterns:
      - "*"
